name: delta_lpg_product_sale
description: "A app which made for LP Gas sale"

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  avatar_glow: ^3.0.1
  flutter_spinkit: ^5.2.2
  flutter_native_splash: ^2.4.6
  flutter_svg: ^2.2.0
  salomon_bottom_bar: ^3.3.2
  carousel_slider: ^5.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:

  uses-material-design: true


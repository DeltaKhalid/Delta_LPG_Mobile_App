<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">

    <!-- Video frame -->
    <rect x="40" y="40" width="432" height="320"
        rx="40" ry="40"
        fill="none" stroke="#4caf50" stroke-width="40"/>

    <!-- Play button -->
    <polygon points="220,160 220,280 320,220"
        fill="none" stroke="#4caf50" stroke-width="40"
        stroke-linejoin="round" stroke-linecap="round"/>

    <!-- Progress bar -->
    <line x1="160" y1="440" x2="472" y2="440"
        stroke="#4caf50" stroke-width="40" stroke-linecap="round"/>

    <!-- Knob -->
    <circle cx="80" cy="440" r="40" fill="#4caf50"/>
</svg>













